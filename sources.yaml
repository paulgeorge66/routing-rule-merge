source_order:
  - top-proxy
  - top-direct
  - apple-proxy
  - apple-direct
  - direct
  - proxy

sources:
  # Public local overrides from the VPS routing model. Server self-access
  # domains/IPs are intentionally omitted from this public repository.
  - name: claude_dependencies
    section: top-proxy
    parser: inline
    rules:
      - DOMAIN-SUFFIX,featuregates.org
      - DOMAIN-SUFFIX,statsig.anthropic.com
      - DOMAIN-SUFFIX,statsig.com
      - DOMAIN-SUFFIX,statsigcdn.com
      - DOMAIN-SUFFIX,statsigapi.net

  - name: google_play_downloads
    section: top-proxy
    parser: inline
    rules:
      - DOMAIN-SUFFIX,play.google.com
      - DOMAIN-SUFFIX,android.clients.google.com
      - DOMAIN-SUFFIX,android.googleapis.com
      - DOMAIN-SUFFIX,play.googleapis.com
      - DOMAIN-SUFFIX,play-fe.googleapis.com
      - DOMAIN-SUFFIX,play-lh.googleusercontent.com
      - DOMAIN-SUFFIX,play-apps-features.googleusercontent.com
      - DOMAIN-SUFFIX,gvt1.com
      - DOMAIN-SUFFIX,gvt2.com
      - DOMAIN-SUFFIX,gvt3.com
      - DOMAIN-SUFFIX,dl.google.com
      - DOMAIN-SUFFIX,ggpht.com
      - DOMAIN-SUFFIX,googleusercontent.com
      - DOMAIN-SUFFIX,googleapis.cn
      - DOMAIN,fonts.gstatic.com
      - DOMAIN,fonts.googleapis.com
      - DOMAIN,www.gstatic.com
      - DOMAIN-SUFFIX,gstatic.com

  - name: bm7_onedrive
    section: top-proxy
    parser: classical_payload
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.yaml

  - name: bm7_microsoft
    section: top-direct
    parser: classical_payload
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml

  - name: private_ranges
    section: top-direct
    parser: inline
    rules:
      - IP-CIDR,0.0.0.0/8,no-resolve
      - IP-CIDR,10.0.0.0/8,no-resolve
      - IP-CIDR,127.0.0.0/8,no-resolve
      - IP-CIDR,169.254.0.0/16,no-resolve
      - IP-CIDR,172.16.0.0/12,no-resolve
      - IP-CIDR,192.168.0.0/16,no-resolve
      - IP-CIDR,198.18.0.0/16,no-resolve
      - IP-CIDR6,::1/128,no-resolve
      - IP-CIDR6,fc00::/7,no-resolve
      - IP-CIDR6,fe80::/10,no-resolve

  - name: bm7_appletv
    section: apple-proxy
    parser: classical_payload
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleTV/AppleTV.yaml

