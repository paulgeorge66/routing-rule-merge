source_order:
  - top-proxy
  - top-direct
  - apple-proxy
  - apple-direct
  - direct
  - proxy

sources:
  # Public local overrides from the VPS routing model. Server self-access
  # domains/IPs are intentionally omitted from this public repository.
  - name: claude_dependencies
    section: top-proxy
    parser: inline
    rules:
      - DOMAIN-SUFFIX,featuregates.org
      - DOMAIN-SUFFIX,statsig.anthropic.com
      - DOMAIN-SUFFIX,statsig.com
      - DOMAIN-SUFFIX,statsigcdn.com
      - DOMAIN-SUFFIX,statsigapi.net

  - name: google_play_downloads
    section: top-proxy
    parser: inline
    rules:
      - DOMAIN-SUFFIX,play.google.com
      - DOMAIN-SUFFIX,android.clients.google.com
      - DOMAIN-SUFFIX,android.googleapis.com
      - DOMAIN-SUFFIX,play.googleapis.com
      - DOMAIN-SUFFIX,play-fe.googleapis.com
      - DOMAIN-SUFFIX,play-lh.googleusercontent.com
      - DOMAIN-SUFFIX,play-apps-features.googleusercontent.com
      - DOMAIN-SUFFIX,gvt1.com
      - DOMAIN-SUFFIX,gvt2.com
      - DOMAIN-SUFFIX,gvt3.com
      - DOMAIN-SUFFIX,dl.google.com
      - DOMAIN-SUFFIX,ggpht.com
      - DOMAIN-SUFFIX,googleusercontent.com
      - DOMAIN-SUFFIX,googleapis.cn
      - DOMAIN,fonts.gstatic.com
      - DOMAIN,fonts.googleapis.com
      - DOMAIN,www.gstatic.com
      - DOMAIN-SUFFIX,gstatic.com

  - name: microsoft_store_update
    section: top-direct
    parser: inline
    rules:
      - DOMAIN,ctldl.windowsupdate.com
      - DOMAIN,definitionupdates.microsoft.com
      - DOMAIN,adl.windows.com
      - DOMAIN,tsfe.trafficshaping.dsp.mp.microsoft.com
      - DOMAIN-SUFFIX,windowsupdate.com
      - DOMAIN-SUFFIX,update.microsoft.com
      - DOMAIN-SUFFIX,delivery.mp.microsoft.com
      - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com
      - DOMAIN-SUFFIX,prod.do.dsp.mp.microsoft.com
      - DOMAIN-SUFFIX,api.cdp.microsoft.com
      - DOMAIN,storeedgefd.dsx.mp.microsoft.com
      - DOMAIN,livetileedge.dsx.mp.microsoft.com
      - DOMAIN,storecatalogrevocation.storequality.microsoft.com
      - DOMAIN,img-prod-cms-rt-microsoft-com.akamaized.net
      - DOMAIN,img-s-msn-com.akamaized.net
      - DOMAIN,share.microsoft.com
      - DOMAIN-SUFFIX,displaycatalog.mp.microsoft.com
      - DOMAIN-SUFFIX,wns.windows.com
      - DOMAIN-SUFFIX,microsoftstore.com
      - DOMAIN-SUFFIX,microsoftstore.com.hk
      - DOMAIN-SUFFIX,microsoftuwp.com
      - DOMAIN,licensing.mp.microsoft.com

  - name: custom_direct_overrides
    section: top-direct
    parser: inline
    rules:
      - DOMAIN-SUFFIX,univ.ciciec.com
      - DOMAIN-SUFFIX,1password.com
      - DOMAIN-SUFFIX,1password.community

  - name: bm7_onedrive
    section: top-proxy
    parser: classical_payload
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.yaml

  - name: bm7_microsoft
    section: top-direct
    parser: classical_payload
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml

  - name: private_ranges
    section: top-direct
    parser: inline
    rules:
      - IP-CIDR,0.0.0.0/8,no-resolve
      - IP-CIDR,10.0.0.0/8,no-resolve
      - IP-CIDR,127.0.0.0/8,no-resolve
      - IP-CIDR,169.254.0.0/16,no-resolve
      - IP-CIDR,172.16.0.0/12,no-resolve
      - IP-CIDR,192.168.0.0/16,no-resolve
      - IP-CIDR,198.18.0.0/16,no-resolve
      - IP-CIDR6,::1/128,no-resolve
      - IP-CIDR6,fc00::/7,no-resolve
      - IP-CIDR6,fe80::/10,no-resolve

  - name: apple_media_overrides
    section: top-proxy
    parser: inline
    rules:
      - DOMAIN,np-edge.itunes.apple.com
      - DOMAIN,play-edge.itunes.apple.com
      - DOMAIN,tv.applemusic.com
      - DOMAIN,uts-api.itunes.apple.com
      - DOMAIN-SUFFIX,tv.apple.com
      - PROCESS-NAME,TV
      - DOMAIN-SUFFIX,itsliveradio.apple.com
      - DOMAIN-SUFFIX,aodp-ssl.apple.com
      - DOMAIN-SUFFIX,video-ssl.itunes.apple.com
      - DOMAIN-SUFFIX,hls-amt.itunes.apple.com
