# Maintained upstream rules with narrow service exceptions; raw sources remain validated.
# DNS follows the exact same section order as routing.
pin_github_revisions: true
source_order:
- top-proxy
- top-direct
- apple-proxy
- apple-direct
- direct
- proxy
sources:
- name: google_play_downloads
  section: top-proxy
  parser: inline
  rules:
  - DOMAIN-SUFFIX,play.google.com
  - DOMAIN-SUFFIX,android.clients.google.com
  - DOMAIN-SUFFIX,android.googleapis.com
  - DOMAIN-SUFFIX,play.googleapis.com
