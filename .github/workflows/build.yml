name: Build routing rules

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build rule providers
        run: python -m routing_merge.builder

      - name: Download mihomo
        run: |
          curl --fail --location --retry 3 --output mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-compatible-v1.19.29.gz
          echo "5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094  mihomo.gz" | sha256sum --check
          gunzip mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Convert domain/ipcidr rules to mrs
        run: |
          ./mihomo convert-ruleset domain text dist/direct-domains.list dist/direct-domains.mrs
          ./mihomo convert-ruleset domain text dist/proxy-domains.list dist/proxy-domains.mrs
          ./mihomo convert-ruleset ipcidr text dist/direct-cidr.list dist/direct-cidr.mrs
          ./mihomo convert-ruleset ipcidr text dist/proxy-cidr.list dist/proxy-cidr.mrs

      - name: Commit generated rules
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "kamisu"
          git config user.email "152141084+paulgeorge66@users.noreply.github.com"
          git add dist/*.list dist/*.yaml dist/*.mrs dist/build-report.json
          if git diff --cached --quiet; then
            echo "No generated rule changes."
          else
            git commit -m "chore: update generated routing rules"
            git push
          fi
